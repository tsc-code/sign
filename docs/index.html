<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>课堂扫码签到</title>

    <!-- 换用国内稳定 CDN -->
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"Microsoft Yahei";text-align:center;padding:40px 20px;background:#f0f4f8;}
        .card{background:#fff;border-radius:16px;padding:35px;margin:0 auto;max-width:480px;box-shadow:0 4px 15px rgba(0,0,0,0.08);}
        .title{font-size:26px;color:#1a1a1a;margin-bottom:12px;}
        .info{color:#555;font-size:15px;margin-bottom:28px;}
        #qrcode{margin:0 auto 25px;}
        #qrcode img{width:330px;height:330px;} /* 确保图片显示 */
        .tips{color:#777;font-size:14px;line-height:1.8;}
        .btn-group{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
        button{padding:8px 16px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;}
    </style>
</head>
<body>
<div class="card">
    <h2 class="title">课程在线签到</h2>
    <p class="info">当前签到场次</p>
    <div id="qrcode"></div>
    <p class="tips">微信/QQ扫码填写信息提交即可<br>每人仅限一次签到，重复提交无效</p>

    <div class="btn-group">
        <button onclick="switchSign()">本场签到</button>
    </div>
</div>

<script>
    const REAL_URL = "https://docs.qq.com/form/page/DSmpQRVJ3bFRzWUZj";
    const qrBox = document.getElementById("qrcode");

    // 改用 toDataURL → <img>，绝对能显示
    function createQr(url) {
        if (!url || !url.startsWith("http")) {
            console.log("链接无效");
            return;
        }

        qrBox.innerHTML = "";

        QRCode.toDataURL(url, {
            width: 330,
            margin: 1
        }, function (err, dataUrl) {
            if (err) {
                console.error("二维码生成失败：", err);
                return;
            }
            const img = new Image();
            img.src = dataUrl;
            img.alt = "签到二维码";
            qrBox.appendChild(img);
            console.log("二维码生成成功（img 模式）");
        });
    }

    // 初始化
    createQr(REAL_URL);

    function switchSign() {
        createQr(REAL_URL);
    }
</script>
</body>
</html>
